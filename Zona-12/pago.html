<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago | Zona 12</title>
  <link rel="stylesheet" href="../access/CSS/styles.css">
</head>

<body>

  <header>
    <img src="../access/imagenes/logo de la marca.png" alt="Logo de la marca Zona 12">
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="sesion.html" class="btn-sesion">Iniciar sesión</a></li>
        <li><a href="administrador.html">Administrador</a></li>
      </ul>
    </nav>
  </header>

  <!-- SECCIÓN PAGO -->
  <section id="pago">
    <h2>Pago de tu Compra</h2>
    <p>Completa el pago para confirmar tu registro. Solo las compras pagadas llegan al panel del administrador.</p>

    <!-- RESUMEN DE LA COMPRA PENDIENTE (SE PINTAN DINÁMICAMENTE) -->
    <div id="pago-resumen"></div>

    <!-- FORMULARIO DE PAGO -->
    <form id="form-pago">
      <label for="titular">Titular de la tarjeta:</label><br>
      <input type="text" id="titular" name="titular" placeholder="Nombre como aparece en la tarjeta" required><br><br>

      <label for="tarjeta">Número de tarjeta:</label><br>
      <input type="text" id="tarjeta" name="tarjeta" placeholder="0000 0000 0000 0000" maxlength="19" required><br><br>

      <div class="pago-fila">
        <div>
          <label for="vencimiento">Vencimiento:</label><br>
          <input type="text" id="vencimiento" name="vencimiento" placeholder="MM/AA" maxlength="5" required>
        </div>
        <div>
          <label for="cvv">CVV:</label><br>
          <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
        </div>
      </div>

      <button type="submit">Pagar y confirmar</button>
      <button type="button" id="btn-cancelar-pago" class="btn-cancelar-pago">Cancelar pago</button>
    </form>

    <!-- MENSAJE DE PAGO COMPLETADO (SE MUESTRA DINÁMICAMENTE) -->
    <div id="pago-mensaje"></div>
  </section>

  <script src="../access/js/main.js"></script>
  <script src="../access/js/pago.js"></script>
</body>

</html>
