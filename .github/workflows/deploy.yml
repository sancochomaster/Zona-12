# Publica la web (frontend) en GitHub Pages cada vez que subes cambios.
# OJO: GitHub Pages solo sirve archivos estáticos, así que aquí NO se publica
# el backend de Express; ese vive en Render y se conecta vía VITE_API_URL.
name: Publicar en GitHub Pages

on:
  push:
    branches: [migracion-react]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si subes dos veces seguidas, deja terminar solo la última publicación.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

      - name: Guardar el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Subir el sitio a GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
