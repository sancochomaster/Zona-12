<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador | Zona 12</title>
  <link rel="stylesheet" href="../access/CSS/styles.css">
</head>

<body>

  <header>
    <img src="../access/imagenes/logo de la marca.png" alt="Logo de la marca Zona 12">
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="sesion.html" class="btn-sesion">Iniciar sesión</a></li>
        <li><a href="administrador.html">Administrador</a></li>
      </ul>
    </nav>
  </header>

  <!-- SECCIÓN ADMINISTRADOR (LOGIN) -->
  <section id="administrador">
    <h2>Acceso Administrador</h2>
    <form id="form-login">
      <label for="usuario">Usuario:</label><br>
      <input type="text" id="usuario" name="usuario" placeholder="Usuario admin" required><br><br>

      <label for="password">Contraseña:</label><br>
      <input type="password" id="password" name="password" placeholder="********" required><br><br>

      <button type="submit">Ingresar</button>
    </form>

    <!-- PANEL DE ADMIN (SE MUESTRA DESPUÉS DE INICIAR SESIÓN) -->
    <div id="mensajes-admin">
      <div class="admin-encabezado">
        <h3>Panel de Administración</h3>
        <p>Consulta por separado los mensajes de contacto y las compras de los clientes.</p>
      </div>

      <!-- PESTAÑAS PARA SEPARAR MENSAJES Y COMPRAS -->
      <div class="admin-tabs">
        <button type="button" class="admin-tab activo" data-panel="panel-mensajes">
          Mensajes de Contacto <span class="admin-contador" id="contador-mensajes">0</span>
        </button>
        <button type="button" class="admin-tab" data-panel="panel-compras">
          Compras de Clientes <span class="admin-contador" id="contador-compras">0</span>
        </button>
      </div>

      <!-- PANEL: MENSAJES DE CONTACTO -->
      <div id="panel-mensajes" class="admin-panel activo">
        <div id="lista-mensajes"></div>
      </div>

      <!-- PANEL: COMPRAS DE CLIENTES -->
      <div id="panel-compras" class="admin-panel">
        <div id="lista-reservas"></div>
      </div>
    </div>
  </section>

  <script src="../access/js/main.js"></script>
</body>

</html>
